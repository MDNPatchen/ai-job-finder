name: Verify qualification matching v2

on:
  pull_request:
    paths:
      - "app.py"
      - "qualification_v2.py"
      - "transfer_fit.py"
      - "test_transfer_fit.py"
      - "career_fit_guardrails.py"
      - "test_career_fit_guardrails.py"
      - "qualification_domains.py"
      - "posting_metadata.py"
      - "employer_ui.py"
      - "test_audit_fixes.py"
      - "test_workplace_provenance.py"
      - "job_sources.json"
      - "test_source_catalog_expansion.py"
      - "qualification_matcher.py"
      - "ranked_breakdowns.py"
      - "mayo_source.py"
      - "test_qualification_v2.py"
      - "test_qualification_matcher.py"
      - "test_ranked_breakdowns.py"
      - "test_nyc_qualification_data.py"
      - ".github/workflows/verify-qualification-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile updated modules
        run: python -m py_compile app.py career_fit_guardrails.py transfer_fit.py qualification_v2.py qualification_domains.py posting_metadata.py employer_ui.py qualification_matcher.py ranked_breakdowns.py mayo_source.py
      - name: Qualification and export unit tests
        run: python -m unittest -v test_career_fit_guardrails test_transfer_fit test_qualification_v2 test_qualification_matcher test_ranked_breakdowns test_nyc_qualification_data test_mayo_source test_audit_fixes test_workplace_provenance test_build_version test_source_catalog_expansion
