name: Check job sources live
# Network check of public career boards. Manual or when candidates change;
# not part of the regression suite because job sites can be briefly down.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/source_candidates.json"
      - "scripts/verify_sources.py"
      - ".github/workflows/verify-source-catalog.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Candidate sources
        run: python scripts/verify_sources.py scripts/source_candidates.json
      - name: Current catalog health
        run: python scripts/verify_sources.py job_sources.json
