name: Verify Streamlit application startup

on:
  pull_request:
    paths:
      - "app.py"
      - "test_v3112_education_pathways.py"
      - "test_v3113_construction_minima.py"
      - "specialist_caution_calibration.py"
      - "test_v3110_sector_lever.py"
      - "government_feed_identity.py"
      - "ui_theme.py"
      - "mayo_source.py"
      - "test_v3115_mayo_procurement.py"
      - ".streamlit/config.toml"
      - "test_ui_theme.py"
      - "transfer_fit.py"
      - "career_fit_guardrails.py"
      - "posting_requirements.py"
      - "formal_qualification_guardrails.py"
      - "official_bulletins.py"
      - "test_v3116_public_bulletins_and_workplace.py"
      - "test_v3117_remote_government_dashboard.py"
      - "qualification_matcher.py"
      - "qualification_v2.py"
      - "job_workflow.py"
      - "test_explicit_remote_title.py"
      - "employer_postings.py"
      - "posting_metadata.py"
      - "tracker_store.py"
      - "job_sources.json"
      - "requirements.txt"
      - "build_info.py"
      - ".github/workflows/verify-streamlit-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the exact Streamlit application dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise Dashboard, Find Jobs and Job Tracker without network queries
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file("app.py").run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          assert not app.sidebar.radio, "Sidebar navigation must be removed"
          nav=app.radio(key="top_navigation")
          nav.set_value("Find Jobs").run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          # Regression: exports must render on a populated search when
          # no resume is uploaded (the previous design hid both buttons).
          app.session_state["search_results"]=[{
              "title":"Regional Operations Director",
              "company":"Example employer","government":False,
              "location":"Minot, ND","url":"https://example.org/job/123",
              "date":"2026-10-15","source":"Direct employer","work_style":"On-site",
              "description":"Lead teams, budgets and multi-site operations."
          }]
          app.session_state["search_stats"]={
              "run_id":"20261016T174400Z","matching_version":"3.1.13",
              "searched":"2026-10-16","excluded":{"old":0,"undated":0,"location":0},"sources":{},
              "errors":[],"fetched":1,"preferences":{}
          }
          app.run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          assert any("Download search results" in x.value
                     for x in app.markdown), "Ranked exports missing without resume"
          app.radio(key="top_navigation").set_value("Job Tracker").run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          app.radio(key="top_navigation").set_value("My Resume").run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          app.radio(key="top_navigation").set_value("Career Analysis").run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          app.radio(key="top_navigation").set_value("Career Matches").run(timeout=60)
          assert not app.exception, [e.message for e in app.exception]
          print("Top navigation and no-resume ranked downloads smoke passed")
          PY
