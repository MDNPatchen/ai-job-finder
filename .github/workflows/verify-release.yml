name: Verify release regression suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/jobfinder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser integration and theme checks
        run: |
          python -m streamlit run app.py --server.headless true > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break || sleep 1; done
          node scripts/browser_smoke.cjs
          python -m streamlit run scripts/browser_fixture.py --server.port 8502 --server.headless true > /tmp/streamlit-fixture.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8502/_stcore/health && break || sleep 1; done
          APP_URL=http://localhost:8502 POPULATED=1 ARTIFACT_DIR=artifacts/populated node scripts/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/
