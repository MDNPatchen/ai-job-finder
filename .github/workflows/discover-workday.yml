name: Discover Workday boards
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/discover_workday.py"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_workday.py
